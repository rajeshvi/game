<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Flappy Bird</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Flappy Bird</h1>
  <canvas id="gameCanvas" width="400" height="600"></canvas>
  <script src="script.js"></script>
<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

let bird = {
  x: 80,
  y: 200,
  width: 30,
  height: 30,
  gravity: 0.6,
  lift: -10,
  velocity: 0
};

let pipes = [];
let score = 0;
let gameOver = false;

canvas.addEventListener("click", () => {
  if (!gameOver) bird.velocity = bird.lift;
  else restartGame();
});

function drawBird() {
  ctx.fillStyle = "yellow";
  ctx.fillRect(bird.x, bird.y, bird.width, bird.height);
}

function updateBird() {
  bird.velocity += bird.gravity;
  bird.y += bird.velocity;

  if (bird.y > canvas.height || bird.y < 0) {
    endGame();
  }
}

function drawPipe(pipe) {
  ctx.fillStyle = "green";
  ctx.fillRect(pipe.x, 0, pipe.width, pipe.top);
  ctx.fillRect(pipe.x, canvas.height - pipe.bottom, pipe.width, pipe.bottom);
}

function updatePipes() {
  for (let i = pipes.length - 1; i >= 0; i--) {
    const p = pipes[i];
    p.x -= 2;

    if (
      bird.x < p.x + p.width &&
      bird.x + bird.width > p.x &&
      (bird.y < p.top || bird.y + bird.height > canvas.height - p.bottom)
    ) {
      endGame();
    }

    if (p.x + p.width < 0) {
      pipes.splice(i, 1);
      score++;
    }
  }

  if (frames % 90 === 0) {
    let top = Math.random() * 200 + 50;
    let bottom = canvas.height - top - 150;
    pipes.push({ x: canvas.width, top, bottom, width: 50 });
  }
}

function drawScore() {
  ctx.fillStyle = "#000";
  ctx.font = "24px Arial";
  ctx.fillText("Score: " + score, 10, 30);
}

function endGame() {
  gameOver = true;
  ctx.fillStyle = "rgba(0, 0, 0, 0.5)";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = "#fff";
  ctx.font = "40px Arial";
  ctx.fillText("Game Over", 100, 300);
  ctx.font = "20px Arial";
  ctx.fillText("Press any key to restart", 100, 340);
}

function restartGame() {
  bird.y = 200;
  bird.velocity = 0;
  pipes.length = 0;
  score = 0;
  gameOver = false;
  frames = 0;
  loop();
}

let frames = 0;

function loop() {
  if (gameOver) return;

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  drawBird();
  updateBird();

  updatePipes();
  pipes.forEach(drawPipe);

  drawScore();

  frames++;
  requestAnimationFrame(loop);
}

loop();
</script>
<style>
body {
  text-align: center;
  background-color: #70c5ce;
  font-family: sans-serif;
  margin: 0;
}

canvas {
  background-color: #fff;
  border: 2px solid #000;
  margin-top: 10px;
}
</style>
</body>
</html>
